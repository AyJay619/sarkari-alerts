name: Check for new notices

# Only a timer and the manual button can start this. Never add pull_request or other
# triggers a stranger could fire: the job runs on your own PC.
on:
  # 5 runs a day, timed 5 minutes BEFORE the times you want, because GitHub usually starts a scheduled run a few minutes late.
  # Times are UTC (cron always is); India is UTC+5:30, so 03:55 UTC = 9:25 am IST, and so on:
  #   03:55 UTC = 9:25 am IST (aim: 9:30 am)     06:55 UTC = 12:25 pm IST (aim: 12:30 pm)   09:55 UTC = 3:25 pm IST (aim: 3:30 pm)
  #   12:55 UTC = 6:25 pm IST (aim: 6:30 pm)     15:55 UTC = 9:25 pm IST (aim: 9:30 pm, the last run of the day)
  schedule:
    - cron: "55 3,6,9,12,15 * * *"
  workflow_dispatch:          # the manual "Run workflow" button

permissions:
  contents: write             # needed to save state files back to the repo

jobs:
  # Every site is checked here, on your own PC ("runner": "india" in sources.json).
  # When the PC is off or asleep, the runs simply wait. Because of the "concurrency" block below, only ONE run can be waiting:
  # each new timer tick replaces the older waiting one (the old one shows as "cancelled", which is normal, not a failure).
  # So when the PC comes on, exactly one run starts, and it catches everything posted meanwhile.
  # (A run's "duration" in the Actions list includes the time it waited for the PC: 3 hours long usually means "the PC was asleep".
  #  If the PC stays off for about a day, GitHub gives up on the waiting run.)
  india:
    runs-on: [self-hosted, india]
    defaults:
      run:
        shell: cmd            # avoids PowerShell's script-execution policy on the PC
    timeout-minutes: 30
    concurrency:
      group: notice-monitor-india
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Uses the Node already installed on the PC (no setup-node download).
      - run: npm ci

      - name: Look for new notices and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # only used if aiEnabled is true in config.json
        run: node src/monitor.mjs --runner india

      - name: Save the list of already-seen notices
        if: always()
        run: node src/save-state.mjs state/seen-india.json state/ai-cache-india.json state/ai-log-india.jsonl
