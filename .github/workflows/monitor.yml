name: Check for new notices

# Only a timer and the manual button can start this. Never add pull_request or other
# triggers a stranger could fire: the job runs on your own PC.
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # the manual "Run workflow" button

permissions:
  contents: write             # needed to save state files back to the repo

jobs:
  # Every site is checked here, on your own PC ("runner": "india" in sources.json).
  # When the PC is off, the runs simply wait. Because of the "concurrency" block below, only ONE run can be waiting:
  # each new timer tick replaces the older waiting one (the old one shows as "cancelled", which is normal, not a failure).
  # So when the PC starts in the morning, exactly one run starts, and it catches everything posted overnight.
  india:
    runs-on: [self-hosted, india]
    defaults:
      run:
        shell: cmd            # avoids PowerShell's script-execution policy on the PC
    timeout-minutes: 30
    concurrency:
      group: notice-monitor-india
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Uses the Node already installed on the PC (no setup-node download).
      - run: npm ci

      - name: Look for new notices and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # only used if aiEnabled is true in config.json
        run: node src/monitor.mjs --runner india

      - name: Save the list of already-seen notices
        if: always()
        run: node src/save-state.mjs state/seen-india.json state/ai-cache-india.json state/ai-log-india.jsonl
