name: AI dry run

# Manual button only (no timer, no other triggers). Runs on your own PC (the "india" runner) so it can open every site.
# It reads the latest 3 notices of ONE site, runs the AI check on them exactly as a live run would (post, vacancies, dates,
# ✅/⛔ line, 🙈 skip), and sends them to your Telegram marked "🧪 TEST", so you can judge the result.
# It changes nothing: no seen-notices state, no AI cache, no log files, and it does not commit anything.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source id from sources.json (e.g. ssc, sbi, rrb-patna, iaf-afcat)"
        default: "ssc"
        required: true

permissions:
  contents: read

jobs:
  ai-dry-run:
    runs-on: [self-hosted, india]
    defaults:
      run:
        shell: cmd            # avoids PowerShell's script-execution policy on the PC
    timeout-minutes: 15
    concurrency:
      group: ai-dry-run                # its own group: a waiting dry run must never replace (cancel) a waiting real check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      # Uses the Node already installed on the PC (no setup-node download).
      - run: npm ci

      - name: Run the AI on the latest notices of one site (TEST alerts only)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOURCE_ID: ${{ inputs.source }}
        run: node src/monitor.mjs --test-ai --test-source "%SOURCE_ID%"
